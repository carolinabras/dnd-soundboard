appId: com.dnd.soundboard
productName: D&D Soundboard
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - "!dist/**/*.map"

win:
  target:
    - target: nsis
      arch:
        - x64
  # icon: build/icon.ico  # add build/icon.ico and uncomment to use a custom icon
  requestedExecutionLevel: asInvoker
  signAndEditExecutable: false

# Artifact names avoid spaces and "&", which GitHub rewrites in download names
nsis:
  artifactName: DnD-Soundboard-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: D&D Soundboard

# macOS can only be built on a Mac (see .github/workflows/release.yml).
# Unsigned: without an Apple Developer ID, users right-click the app > Open the first time.
mac:
  target:
    - target: dmg
      arch:
        - universal
  category: public.app-category.music
  identity: null

dmg:
  artifactName: DnD-Soundboard-${version}-mac.${ext}

linux:
  target:
    - target: AppImage
      arch:
        - x64
  category: Audio

appImage:
  artifactName: DnD-Soundboard-${version}-linux-x86_64.${ext}

publish: null
